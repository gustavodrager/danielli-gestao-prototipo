name: Verificar aplicação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: danielli_ci
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: danielli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U danielli_ci -d danielli_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://danielli_ci:ci-disposable-only@127.0.0.1:5432/danielli_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
